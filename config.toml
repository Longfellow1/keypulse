[app]
db_path = "~/.penpal/penpal.db"
log_path = "~/.penpal/penpal.log"
flush_interval_sec = 5

[watchers]
window = true
idle = true
clipboard = true
manual = true
browser = false
browser_url = true
ax_text = false
# === OCR watcher 已下线 2026-05-14 ===
# 原因：日均 9 条 / 权重 0.5 / macOS Vision 绑死 / 屏幕录制权限门槛高 / 键盘+AX+clipboard 已覆盖
# 回退方法：移除本块注释 + 恢复 manager.py 里 OCR 调度分支
# 历史 raw_events 中 ocr_text_capture 数据保留可读
# ocr = false

[idle]
threshold_sec = 180

[clipboard]
max_text_length = 2000
dedup_window_sec = 600

[ax_text]
poll_interval_sec = 1.0

[browser]
poll_interval_sec = 1.0
supported_browsers = ["Safari", "Google Chrome", "Arc", "Brave Browser", "Microsoft Edge"]

[browser_url]
poll_interval_sec = 3.0
supported_browsers = "auto"
emit_on_url_change_only = true

[browser_history]
enabled = false
poll_interval_sec = 300
copy_to_cache = true
browsers = ["Safari", "Google Chrome", "Arc", "Microsoft Edge", "Brave Browser", "Firefox"]

[ocr]
# === OCR watcher 已下线 2026-05-14 ===
# 原因：日均 9 条 / 权重 0.5 / macOS Vision 绑死 / 屏幕录制权限门槛高 / 键盘+AX+clipboard 已覆盖
# 回退方法：移除本块注释 + 恢复 manager.py 里 OCR 调度分支
# 历史 raw_events 中 ocr_text_capture 数据保留可读
# provider = "vision_native"
# window_switch_delay_sec = 0.8
# stable_interval_sec = 10.0
# keyboard_quiet_sec = 2.0

[privacy]
redact_emails = true
redact_phones = true
redact_tokens = true
camera_scene_pause = true
# Chat apps (WeChat, Slack, Telegram, ...) are excluded from capture by default. Opt a specific app in
# to store its content as Private, e.g. chat_apps_opt_in = ["WeChat"]. Known names: penpal/capture/chat_apps.py
chat_apps_opt_in = []

[sources.scheduler]
enabled = true
poll_interval_sec = 600
debounce_sec = 300

[[policies]]
scope_type = "app"
scope_value = "1Password"
mode = "deny"

[[policies]]
scope_type = "app"
scope_value = "Keychain Access"
mode = "deny"

[[policies]]
scope_type = "app"
scope_value = "Terminal"
mode = "metadata-only"

[[policies]]
scope_type = "window"
scope_value = "login"
mode = "deny"
